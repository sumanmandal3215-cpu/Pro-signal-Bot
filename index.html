<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Bhai AI BOT Pro</title>
    <style>
        /* CSS অংশ - সব কালার এবং ডিজাইন এখানে */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* ভিডিও ব্যাকগ্রাউন্ড */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.5;
        }

        .app-container {
            width: 360px;
            text-align: center;
            z-index: 1;
        }

        .robot-img {
            width: 180px;
            filter: drop-shadow(0 0 15px #00eaff);
            margin-bottom: -30px;
        }

        .bot-card {
            background: rgba(15, 15, 15, 0.95);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* মার্কেট গ্রিড স্টাইল */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .market-item {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.3s;
        }

        .market-item.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
            color: #f1c40f;
        }

        .asset-label { color: #888; font-size: 10px; text-align: left; display: block; margin-bottom: 5px;}
        .current-market-title { color: #f1c40f; font-size: 22px; font-weight: bold; margin-bottom: 15px; }

        /* সিগন্যাল বক্স */
        .signal-box {
            padding: 20px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #333;
            transition: 0.4s;
        }

        .status-ready { background: #333; color: #fff; }
        .status-analyzing { background: #f1c40f; color: #000; }
        .status-up { background: #00ff88; color: #000; box-shadow: 0 0 20px #00ff88; }
        .status-down { background: #ff3366; color: #fff; box-shadow: 0 0 20px #ff3366; }

        /* ইনপুট গ্রুপ */
        .input-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group { flex: 1; text-align: left; }
        .input-group label { color: #888; font-size: 10px; display: block; margin-bottom: 5px; }

        .custom-select {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        /* বাটন */
        .get-signal-btn {
            width: 100%;
            padding: 16px;
            background: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .get-signal-btn:active { transform: scale(0.98); }

        .telegram-btn {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 212, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .telegram-btn span { color: #00eaff; font-weight: bold; }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="background-video.mp4" type="video/mp4">
    </video>

    <div class="app-container">
        <div class="robot-section">
            <img src="robot.png" alt="Robot" class="robot-img">
        </div>

        <div class="bot-card">
            <span class="asset-label">SELECT ASSET</span>
            <div class="market-grid">
                <div class="market-item active" onclick="setMarket('CRYPTO IDX', this)">CRYPTO IDX</div>
                <div class="market-item" onclick="setMarket('EUR/USD', this)">EUR/USD</div>
                <div class="market-item" onclick="setMarket('AUD/CAD', this)">AUD/CAD</div>
                <div class="market-item" onclick="setMarket('BITCOIN', this)">BITCOIN</div>
            </div>

            <div id="display-market" class="current-market-title">CRYPTO IDX</div>

            <div id="signal-box" class="signal-box status-ready">
                <span id="signal-text">READY</span>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>TIME</label>
                    <select class="custom-select" id="time-select">
                        <option>1 MINUTE</option>
                        <option>2 MINUTES</option>
                        <option>5 MINUTES</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ACCURACY</label>
                    <div style="color: #f1c40f; font-weight: bold; padding: 8px;">98.5%</div>
                </div>
            </div>

            <button class="get-signal-btn" id="action-btn" onclick="generateSignal()">Get Signal</button>

            <a href="https://t.me/your_link" target="_blank" class="telegram-btn">
                👉 Join Telegram: <span>Trader Bhai Official</span>
            </a>
        </div>
    </div>

    <script>
        function setMarket(name, element) {
            document.querySelectorAll('.market-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('display-market').innerText = name;
            resetBox();
        }

        function resetBox() {
            const box = document.getElementById('signal-box');
            const txt = document.getElementById('signal-text');
            box.className = "signal-box status-ready";
            txt.innerText = "READY";
        }

        function generateSignal() {
            const btn = document.getElementById('action-btn');
            const box = document.getElementById('signal-box');
            const txt = document.getElementById('signal-text');

            btn.disabled = true;
            box.className = "signal-box status-analyzing";
            txt.innerText = "ANALYZING...";

            setTimeout(() => {
                const results = ["UP ⬆️", "DOWN ⬇️"];
                const final = results[Math.floor(Math.random() * results.length)];
                
                txt.innerText = final;
                box.className = final.includes("UP") ? "signal-box status-up" : "signal-box status-down";
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
